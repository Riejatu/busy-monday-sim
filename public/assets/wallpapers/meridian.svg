<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#0a1627"/>
      <stop offset="0.52" stop-color="#050a12"/>
      <stop offset="1" stop-color="#05070d"/>
    </linearGradient>

    <radialGradient id="glow" cx="0.58" cy="0.26" r="0.66">
      <stop offset="0" stop-color="#1B365D" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#1B365D" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glowFar" cx="0.84" cy="0.88" r="0.52">
      <stop offset="0" stop-color="#8d9bae" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#8d9bae" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.14"/>
      <stop offset="0.48" stop-color="#546886" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.02"/>
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#base)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>
  <rect width="1920" height="1080" fill="url(#glowFar)"/>

  <g stroke="#ffffff" stroke-opacity="0.035" stroke-width="1" fill="none">
      <line x1="-400" y1="1180" x2="220" y2="-100"/>
